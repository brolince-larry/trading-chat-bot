services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forex
      POSTGRES_PASSWORD: forex
      POSTGRES_DB: forex_ai
    ports:
      - "5432:5432"
    volumes:
      - forex_ai_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forex -d forex_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://forex:forex@db:5432/forex_ai
      MARKET_DATA_PROVIDER: simulated
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  forex_ai_db_data:
